server:
  port: ${PORT:8080}
spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/impossibl_db}
    username: ${DATABASE_USERNAME:impossibl_admin}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  spring:
    profiles:
      active: dev

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  cookie:
    secure: false
    same-site: Lax